name: Atualiza a arte do perfil

"on":
  schedule:
    - cron: "17 6 * * *"   # todo dia ~06:17 UTC (03:17 em Brasília)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/profile.json"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Coleta o calendário público de contribuições
        run: python scripts/fetch_contributions.py

      # o card mostra os mesmos números, entao regenera junto com o heatmap
      - name: Redesenha heatmap e card
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza a arte do perfil [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg"
